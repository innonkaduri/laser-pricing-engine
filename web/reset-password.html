<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>קביעת סיסמה חדשה — ימיש כדורי</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preload" as="font" type="font/woff2" href="/fonts/assistant-hebrew.woff2" crossorigin>
<link rel="stylesheet" href="/brand.css">
<style>
body{min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:var(--s6) var(--s5)}
.card{width:100%; max-width:380px; padding:var(--s8) var(--s6)}
.mark{display:flex; align-items:center; gap:10px; margin-bottom:var(--s6)}
.mark svg{width:34px; height:34px; color:var(--flame-600)}
.mark b{font-size:17px; letter-spacing:-.015em}
h1{font-size:24px; letter-spacing:-.025em; margin:0 0 6px}
p.sub{font-size:var(--fs-sm); color:var(--ink-500); margin:0 0 var(--s6); line-height:1.6}
label{display:block; font-size:var(--fs-xs); font-weight:650; color:var(--ink-700); margin:0 0 6px}
input{margin-bottom:var(--s5)}
.submit{width:100%}
.foot{margin:var(--s6) 0 0; font-size:var(--fs-xs); color:var(--ink-500); text-align:center}
.foot a{color:var(--flame-600); font-weight:650}
</style>
</head>
<body>

<form class="card" id="form">
  <a class="mark" href="/">
    <svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M5 8.5A3.5 3.5 0 0 1 8.5 5h9.9L27 13.6v9.9A3.5 3.5 0 0 1 23.5 27h-15A3.5 3.5 0 0 1 5 23.5v-15Z" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><path d="M18.4 5v5.1a3.5 3.5 0 0 0 3.5 3.5H27" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><circle cx="12.4" cy="19.6" r="3" fill="currentColor"/></svg>
    <b>ימיש כדורי</b>
  </a>

  <h1>סיסמה חדשה</h1>
  <p class="sub">כל הסשנים הפתוחים בחשבון ינותקו ברגע שהסיסמה תיקבע.</p>

  <div class="note note-bad hidden" id="error" style="margin-bottom:var(--s4)"></div>

  <div id="fields">
    <label for="p">סיסמה חדשה</label>
    <input id="p" type="password" autocomplete="new-password" required>

    <label for="p2">שוב, לוודא</label>
    <input id="p2" type="password" autocomplete="new-password" required>

    <button class="btn btn-primary submit" id="go" type="submit">קבע סיסמה</button>
  </div>

  <p class="foot"><a href="/login">חזרה לכניסה</a></p>
  <p class="foot" style="margin-top:var(--s4)"><a href="/terms">תקנון</a> · <a href="/accessibility">נגישות</a></p>
</form>

<script>
const errorBox = document.getElementById('error');
const params = new URLSearchParams(location.search);
const token = params.get('token') || '';

function fail(message) {
  errorBox.textContent = message;
  errorBox.classList.remove('hidden');
}

if (!token) {
  document.getElementById('fields').classList.add('hidden');
  fail('הקישור חסר טוקן. בקש קישור חדש מ־/forgot-password.');
}

document.getElementById('form').addEventListener('submit', async (event) => {
  event.preventDefault();
  const button = document.getElementById('go');
  const password = document.getElementById('p').value;
  const again = document.getElementById('p2').value;

  errorBox.classList.add('hidden');
  if (password.length < 8) return fail('הסיסמה חייבת להיות באורך 8 תווים לפחות.');
  if (password !== again) return fail('שתי הסיסמאות אינן זהות.');

  button.disabled = true;
  button.textContent = 'קובע…';
  try {
    const response = await fetch('/api/password-reset/confirm', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, password }),
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.detail || 'הקישור אינו תקין או שפג תוקפו.');
    location.href = data.next || '/';
  } catch (err) {
    fail(err.message);
    button.disabled = false;
    button.textContent = 'קבע סיסמה';
  }
});
</script>

</body>
</html>
