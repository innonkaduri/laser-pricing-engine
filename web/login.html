<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>כניסה — ימיש כדורי</title>
<link rel="preload" as="font" type="font/woff2" href="/fonts/assistant-hebrew.woff2" crossorigin>
<link rel="stylesheet" href="/brand.css">
<style>
/* מסך כניסה — כרטיס אחד במרכז. כל השאר מ-/brand.css. */
body{min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:var(--s5)}
.card{width:100%; max-width:400px; padding:var(--s8) var(--s6)}
h1{font-size:21px; margin-bottom:var(--s1)}
p.sub{font-size:var(--fs-sm); margin-bottom:var(--s6)}
label{display:block; font-size:var(--fs-xs); font-weight:600; color:var(--ink-600); margin:0 0 6px}
input{margin-bottom:var(--s4)}
button{width:100%}
.error{margin-bottom:var(--s4)}
.foot{margin:var(--s5) 0 0; font-size:var(--fs-xs); color:var(--ink-500); line-height:1.7; text-align:center}
.foot a{color:var(--flame-600); font-weight:600}
.brand-top{display:flex; justify-content:center; margin-bottom:var(--s6)}
.brand-top svg{width:38px; height:38px; color:var(--flame-600)}
</style>
</head>
<body>

<form class="card" id="form">
  <div class="brand-top"><svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M5 8.5A3.5 3.5 0 0 1 8.5 5h9.9L27 13.6v9.9A3.5 3.5 0 0 1 23.5 27h-15A3.5 3.5 0 0 1 5 23.5v-15Z" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><path d="M18.4 5v5.1a3.5 3.5 0 0 0 3.5 3.5H27" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><circle cx="12.4" cy="19.6" r="3" fill="currentColor"/></svg></div>
  <h1>ימיש כדורי</h1>
  <p class="sub">כניסה למערכת התמחור</p>

  <div class="note note-bad error hidden" id="error"></div>

  <label for="u">שם משתמש</label>
  <input id="u" name="username" autocomplete="username" autocapitalize="off" autocorrect="off" required>

  <label for="p">סיסמה</label>
  <input id="p" name="password" type="password" autocomplete="current-password" required>

  <button id="go" type="submit">כניסה</button>

  <p class="foot">
    אין לך חשבון? <a href="/signup">הרשמה</a> — חינם, פחות מדקה.
  </p>

  <p class="foot">
    ממלא את טבלת המחירים? הקישור שקיבלת בטלפון עובד כמו שהוא — אין
    צורך בשם משתמש.
  </p>
</form>

<script>
const params = new URLSearchParams(location.search);
const next = params.get('next') || '/';
const errorBox = document.getElementById('error');

function showError(message) {
  errorBox.textContent = message;
  errorBox.classList.remove('hidden');
}

document.getElementById('form').addEventListener('submit', async (event) => {
  event.preventDefault();
  const button = document.getElementById('go');
  button.disabled = true;
  button.textContent = 'נכנס…';
  errorBox.classList.add('hidden');
  try {
    const response = await fetch('/api/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        username: document.getElementById('u').value,
        password: document.getElementById('p').value,
        next,
      }),
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.detail || 'הכניסה נכשלה.');
    location.href = data.next || '/';
  } catch (err) {
    showError(err.message);
    button.disabled = false;
    button.textContent = 'כניסה';
  }
});
</script>

</body>
</html>
