<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ההצעות שלי — ימיש כדורי</title>
<link rel="preload" as="font" type="font/woff2" href="/fonts/assistant-hebrew.woff2" crossorigin>
<link rel="stylesheet" href="/brand.css">
<style>
/* היסטוריה — רשימת כרטיסים, לא טבלה. בטלפון טבלה בת שמונה עמודות
   נקראת לרוחב או מתכווצת עד שהמספרים נדבקים. */
.summary{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:var(--s4); margin-bottom:var(--s6)}
.entry{
  background:var(--paper); border:1px solid var(--ink-150); border-radius:var(--r-md);
  padding:var(--s4) var(--s5); display:grid; gap:var(--s2);
  grid-template-columns:1fr auto; align-items:start;
}
.entry+.entry{margin-top:var(--s3)}
.entry h3{margin:0; font-size:15.5px; font-weight:650; letter-spacing:-.01em}
.entry .meta{font-size:var(--fs-xs); color:var(--ink-500); line-height:1.7}
.entry .meta b{color:var(--ink-700); font-weight:600}
.entry .price{
  text-align:start; font-variant-numeric:tabular-nums; direction:ltr;
  font-size:19px; font-weight:750; letter-spacing:-.02em; white-space:nowrap;
}
.entry .when{font-size:11.5px; color:var(--ink-400); font-variant-numeric:tabular-nums; direction:ltr; text-align:right}
.entry .acts{grid-column:1/-1; display:flex; gap:var(--s3); align-items:center; padding-top:var(--s3); border-top:1px solid var(--ink-150)}
/* **גם `padding` ו-`min-height` צריכים איפוס.** ב-brand.css יושבת
   שורת גשר — `button:not(.btn):not(.ghost)` — שהופכת כל כפתור חשוף
   לכפתור ראשי: רקע כתום, ריפוד, גובה מינימלי ורדיוס. איפוס של
   הרקע והמסגרת בלבד השאיר עיגול לבן מרחף מאחורי "מחק". */
.entry .acts a,.entry .acts button{
  font:inherit; font-size:var(--fs-xs); font-weight:650; border:0; background:none;
  color:var(--flame-600); cursor:pointer; text-decoration:none;
  padding:0; min-height:0; border-radius:0; box-shadow:none;
}
.entry .acts .drop{color:var(--ink-400); margin-inline-start:auto}
.entry .acts .drop:hover{color:var(--bad-600)}
.dims{display:flex; flex-wrap:wrap; gap:4px 10px; font-size:11.5px; color:var(--ink-500)}
.dims span{font-variant-numeric:tabular-nums}
@media (max-width:520px){ .entry{grid-template-columns:1fr} .entry .price{font-size:17px} }
</style>
</head>
<body>

<header class="topbar">
  <div class="wrap-wide">
    <a class="brand" href="/">
      <svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M5 8.5A3.5 3.5 0 0 1 8.5 5h9.9L27 13.6v9.9A3.5 3.5 0 0 1 23.5 27h-15A3.5 3.5 0 0 1 5 23.5v-15Z" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><path d="M18.4 5v5.1a3.5 3.5 0 0 0 3.5 3.5H27" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><circle cx="12.4" cy="19.6" r="3" fill="currentColor"/></svg>
      <span class="name"><b>ימיש כדורי</b><span>ההצעות שלי</span></span>
    </a>
    <span class="spacer"></span>
    <nav class="row">
      <a class="navlink" href="/catalog">קטלוג</a>
      <a class="navlink" href="/account">החשבון שלי</a>
      <a class="navlink" href="/">תמחור</a>
    </nav>
  </div>
</header>

<main class="wrap" style="padding-block:var(--s6) var(--s10)">
  <h1 style="font-size:var(--fs-h2); letter-spacing:-.02em; margin-bottom:var(--s2)">ההצעות שלי</h1>
  <p class="muted" style="max-width:60ch; line-height:1.65; margin-bottom:var(--s6)" id="scope"></p>

  <div class="summary hidden" id="summary"></div>
  <div class="note note-info" id="state">טוען…</div>
  <div id="list"></div>
  <div style="margin-top:var(--s5); text-align:center">
    <button class="btn btn-secondary hidden" id="more">עוד הצעות</button>
  </div>
</main>

<script type="module">
const $ = (id) => document.getElementById(id);
const NUM = new Intl.NumberFormat('he-IL', { maximumFractionDigits: 1 });
const INT = new Intl.NumberFormat('he-IL');
const money = (n) =>
  '₪' + Number(n).toLocaleString('he-IL', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

const SOURCE = { catalog: 'מהקטלוג', file: 'מקובץ או ממידות', manual: 'ממידות' };
let cursor = null;
let painted = 0;

function when(stamp) {
  /* תאריך מלא ולא "לפני יומיים": הצעת מחיר נמדדת מול יום, והטבלה
     מתעדכנת — "לפני יומיים" לא אומר אם המחיר עוד תקף. */
  const d = new Date(stamp);
  if (Number.isNaN(d.getTime())) return stamp;
  return `${String(d.getDate()).padStart(2, '0')}.${String(d.getMonth() + 1).padStart(2, '0')}.${d.getFullYear()} · ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}

function dims(item) {
  const entries = Object.entries(item.dimensions || {});
  if (!entries.length) return '';
  return `<div class="dims">${entries
    .map(([k, v]) => `<span>${escapeHtml(k)}: <b>${typeof v === 'number' ? NUM.format(v) : escapeHtml(String(v))}</b></span>`)
    .join('')}</div>`;
}

function escapeHtml(text) {
  return String(text).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
}

function card(item) {
  const node = document.createElement('article');
  node.className = 'entry';
  const title = item.product_name || SOURCE[item.source] || 'הצעה';
  const spec = [
    item.material_name,
    item.thickness_mm ? `${NUM.format(item.thickness_mm)} מ״מ` : '',
    item.quantity > 1 ? `כמות ${INT.format(item.quantity)}` : '',
    item.bend_count ? `${item.bend_count} כיפופים` : '',
    item.cut_length_mm ? `חיתוך ${NUM.format(item.cut_length_mm / 1000)} מ׳` : '',
  ].filter(Boolean).join(' · ');

  node.innerHTML = `
    <div>
      <h3>${escapeHtml(title)}</h3>
      <div class="meta">${escapeHtml(spec)}</div>
      ${dims(item)}
    </div>
    <div>
      <div class="price">${money(item.total)}</div>
      <div class="when">${when(item.at)}</div>
    </div>
    <div class="acts">
      ${item.product_id ? `<a href="/product/${encodeURIComponent(item.product_id)}">פתח את המוצר שוב</a>` : '<span class="meta">תמחור מקובץ — אין מוצר לפתוח</span>'}
      ${item.min_order_applied ? '<span class="tag tag-warn">מינימום הזמנה</span>' : ''}
      <button class="drop" data-id="${item.id}">מחק</button>
    </div>`;

  node.querySelector('.drop').addEventListener('click', async (event) => {
    const id = event.currentTarget.dataset.id;
    if (!confirm('למחוק את ההצעה הזאת?')) return;
    const response = await fetch(`/api/history/${id}`, { method: 'DELETE' });
    if (response.ok) {
      node.remove();
      painted -= 1;
      if (!painted) reload();
    }
  });
  return node;
}

function paintSummary(data) {
  $('summary').classList.remove('hidden');
  $('summary').innerHTML = [
    ['הצעות שמורות', INT.format(data.count)],
    ['סכום מצטבר', money(data.total_amount)],
    ['נשמרות', `${INT.format(data.keep_per_user)} אחרונות`],
  ]
    .map(([k, v]) => `<div class="stat"><div class="k">${k}</div><div class="v num">${v}</div></div>`)
    .join('');
}

async function load(append) {
  const url = cursor ? `/api/history?limit=20&before=${cursor}` : '/api/history?limit=20';
  const response = await fetch(url);
  if (response.status === 401) return void (location.href = '/login?next=/history');
  if (!response.ok) {
    $('state').className = 'note note-bad';
    $('state').textContent = 'לא הצלחנו לטעון את ההיסטוריה.';
    return;
  }
  const data = await response.json();
  if (!append) {
    $('list').innerHTML = '';
    painted = 0;
    paintSummary(data);
  }

  if (!data.items.length && !painted) {
    /* **ריק אינו שגיאה, והוא גם לא אפס.** מסך שמראה "0 הצעות" נקרא
       כמו מדידה; מה שנכון כאן הוא להסביר איך מגיעה ההצעה הראשונה. */
    $('state').className = 'note note-info';
    $('state').innerHTML =
      'עוד לא הוצאת הצעה. <a href="/catalog" style="font-weight:700">בחר מוצר מהקטלוג</a> ' +
      'או <a href="/" style="font-weight:700">העלה קובץ</a> — ההצעה תישמר כאן אוטומטית.';
    $('more').classList.add('hidden');
    return;
  }

  $('state').classList.add('hidden');
  const list = $('list');
  for (const item of data.items) list.appendChild(card(item));
  painted += data.items.length;
  cursor = data.next_before;
  $('more').classList.toggle('hidden', !data.has_more);
}

function reload() {
  cursor = null;
  $('state').classList.remove('hidden');
  load(false);
}

$('more').addEventListener('click', () => load(true));

$('scope').textContent =
  'כל הצעה שהוצאת נשמרת כאן אוטומטית — מוצר, מידות, חומר וסכום. ' +
  'שם קובץ אינו נשמר, וההיסטוריה הזאת נראית לך בלבד.';

load(false);
</script>

</body>
</html>
