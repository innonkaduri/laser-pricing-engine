# vhost של nginx למנוע התמחור. **היה קיים רק על הקופסה עד 23.8.2026**
# (`/etc/nginx/sites-available/laser`) — כלומר מחיקת הקופסה מחקה גם את
# הדרך היחידה להגיע לשירות. אין כאן שום סוד.
#
#   install -m 644 /opt/laser/deploy/nginx-laser.conf /etc/nginx/sites-available/laser
#   ln -sf /etc/nginx/sites-available/laser /etc/nginx/sites-enabled/laser
#   nginx -t && systemctl reload nginx
#
# **מה שנאמת מבחוץ ב-23.8.2026 ותלוי בקובץ הזה:**
# - `$proxy_add_x_forwarded_for` **מוסיף** את הכתובת האמיתית בסוף, ו-
#   uvicorn לוקח את הערך המהימן. נבדק: שליחת `X-Forwarded-For` מזויף
#   **אינה** עוקפת את הגבלת הקצב (429 גם עם 203.0.113.99 וגם עם
#   198.51.100.7). אל תחליף ל-`$remote_addr` בלי לבדוק את זה שוב.
# - `X-Forwarded-Proto https` הוא מה שנותן לעוגיית הסשן את הדגל
#   `Secure`. נמדד ב-`set-cookie`: `HttpOnly; SameSite=lax; Secure`.
#   בלי השורה הזאת האפליקציה רואה "http" והדגל נופל בשקט.
# - `client_max_body_size 25m` חייב להישאר מסונכרן עם `MAX_UPLOAD_MB`
#   בשירות, אחרת קובץ גדול נדחה ב-413 של nginx בלי ההסבר של האפליקציה.

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name laser.82.29.184.166.nip.io;

    ssl_certificate     /etc/letsencrypt/live/laser.82.29.184.166.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/laser.82.29.184.166.nip.io/privkey.pem;

    # DXF uploads: the default 1m rejects a real drawing with a bare 413.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
    }
}
