# Drop-in של laser-pricing. **הוא עצמו אינו סוד** — הוא רק מפנה לקובץ
# שמחזיק אותם. הקובץ ההוא (/etc/laser-pricing.env, 600 root) אינו
# בריפו ואינו מגובה, בכוונה: הוא היה יוצא מהקופסה אל לפטופ שנוסע,
# והוא גם אינו נחוץ לשחזור — סיסמה אפשר לקבוע מחדש, את הטבלה של אבא
# אי אפשר.
#
# נמצא חסר בתרגיל שחזור, 23.8.2026: בלי הקובץ הזה השירות עולה **בלי
# שום משתנה סביבה**, כלומר קורא את הטבלה מהנתיב הלא נכון ומחזיק
# SESSION_SECRET אקראי לכל הפעלה. הוא עלה, והוא היה שגוי.
#
#   install -D -m 644 /opt/laser/deploy/10-auth.conf \
#       /etc/systemd/system/laser-pricing.service.d/10-auth.conf
#   systemctl daemon-reload && systemctl restart laser-pricing
#
# המשתנים שהקובץ ההוא חייב להכיל מפורטים ב-docs/RESTORE.md.

[Service]
EnvironmentFile=/etc/laser-pricing.env
